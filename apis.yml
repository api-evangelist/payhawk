description: >
  Payhawk is a spend management platform that enables finance teams to issue corporate
  cards, capture and manage expenses, process invoices, enforce budget controls, and
  integrate with ERP and accounting systems. The platform serves businesses across
  Europe, the US, and the UK in over 32 countries. Payhawk exposes a RESTful Developer
  API at https://api.payhawk.io/api/v3 that allows custom integrations over expenses,
  transactions, cards, employees, custom fields, fund accounts, and bank statements.
  The API is authenticated via API key, supports real-time webhooks for event-driven
  automation, and is rate-limited to 15 requests per second. The API is free to use
  for all Payhawk account holders, with no separate developer tier required.
